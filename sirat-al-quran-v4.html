${C('user','Created by','Sirat Al-Quran was designed and developed by '+esc(OWNER)+'. © '+YR+' '+esc(OWNER)+'. All rights reserved.')}<a class="card rw ln" href="#/license" style="border:1px solid var(--bd)"><span>${ic('doc')} License, copyright &amp; privacy</span>${ic('chev',18)}</a><a class="card rw ln" href="#/themes" style="border:1px solid var(--bd)"><span>${ic('shield')} Appearance &amp; themes</span>${ic('chev',18)}</a></div>`)},
prayer(){page('Prayer Times',`<div class="card" id="pt">Loading…</div><div class="card"><input class="inp" id="ci" placeholder="City" value="${esc(S.city?.city||'')}"><input class="inp" id="co" placeholder="Country" value="${esc(S.city?.country||'')}"><button class="btn" id="cs">Use this location</button> <button class="btn" id="gp">Use my location</button></div>`);
$('#cs').onclick=()=>{S.city={city:$('#ci').value,country:$('#co').value};S.geo=null;PT=null;persist();pDraw()};$('#gp').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{S.geo={lat:p.coords.latitude,lng:p.coords.longitude};PT=null;persist();pDraw()},()=>toast('Location denied. Enter a city instead.'));pDraw()},
qibla(){page('Qibla','<div class="card" style="text-align:center"><div class="compass"><i id="nd"></i></div><div id="qi">Allow location to find the Qibla direction.</div><br><button class="btn" id="qb">Start compass</button></div>');
$('#qb').onclick=()=>{if(!navigator.geolocation)return $('#qi').textContent='Location is unavailable on this device.';navigator.geolocation.getCurrentPosition(async p=>{const b=bear(p.coords.latitude,p.coords.longitude);$('#qi').textContent=`Qibla bearing: ${b.toFixed(1)}° from North`;$('#nd').style.transform=`rotate(${b}deg)`;
if(typeof DeviceOrientationEvent==='undefined')return $('#qi').textContent+=' — Compass sensor is unavailable on this device.';
try{if(DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted')throw 0}catch{return $('#qi').textContent+=' — Motion permission denied.'}
let got=0,cur=0;const h=e=>{const d=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?360-e.alpha:null);if(d==null)return;got=1;const t=nm(b-d);cur+=((t-cur+540)%360)-180;$('#nd').style.transform=`rotate(${cur}deg)`};
addEventListener('deviceorientationabsolute',h,true);addEventListener('deviceorientation',h,true);setTimeout(()=>{if(!got)$('#qi').textContent+=' — Compass sensor is unavailable on this device.'},2500)},()=>$('#qi').textContent='Location permission denied.')}},
pray(){const H=(t,r)=>`<div class="card"><b>${t}</b><div class="tr">${r}</div></div>`,Z=(a,e)=>`<div class="txt ar" style="font-size:1.6rem;line-height:2.2">${a}</div><div class="tl">${e}</div>`;
page('How to Pray',`<div class="card mut">A beginner's guide to the prayer as taught in the Sunnah. Scholars and schools differ on some details (hand position, Witr, and others); learn the finer points from a qualified teacher.</div>
${H('1. Wudu','Say Bismillah. Wash hands, rinse mouth, clean nose, wash face, wash arms to the elbows, wipe the head and ears, then wash feet to the ankles. Wash each part up to three times, in order.')}
${H('2. Preparation','Be in a state of purity, wear clean covering clothes, face the Qibla, and pray within the time.')}
${H('3. Intention and Takbir','Make the intention in the heart for the specific prayer; it is not spoken aloud. Stand, raise the hands to the shoulders or ears and say:'+Z('اللهُ أَكْبَرُ','Allahu Akbar'))}
${H('4. Qiyam (standing)','Place the hands on the chest or above the navel (schools differ). Optionally say an opening supplication, seek refuge in Allah, say Bismillah, then recite Al-Fatihah (Surah 1) and another Surah in the first two rakahs. Look toward the place of prostration.')}
${H('5. Ruku (bowing)','Say Allahu Akbar and bow with the back straight, hands on the knees. Say three times:'+Z('سُبْحَانَ رَبِّيَ الْعَظِيمِ','Subhana Rabbiyal Azeem'))}
${H('6. Standing after Ruku','Rise saying:'+Z('سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ','Sami Allahu liman hamidah')+Z('رَبَّنَا وَلَكَ الْحَمْدُ','Rabbana wa lakal hamd'))}
${H('7. Sujood (prostration)','Say Allahu Akbar and prostrate on seven points: forehead with nose, both palms, both knees, and the toes of both feet. Say three times:'+Z('سُبْحَانَ رَبِّيَ الْأَعْلَى','Subhana Rabbiyal A\'la'))}
${H('8. Sitting between the two Sujood','Sit up saying Allahu Akbar and say:'+Z('رَبِّ اغْفِرْ لِي','Rabbigh-fir li')+'Then prostrate a second time. This completes one rakah; stand for the next.')}
${H('9. Tashahhud (after the 2nd rakah)','Sit and recite:'+Z('التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ','At-tahiyyatu lillahi was-salawatu wat-tayyibat... ash-hadu an la ilaha illallah wa ash-hadu anna Muhammadan abduhu wa rasuluh')+'In prayers of three or four rakahs, stand after this for the remaining rakahs.')}
${H('10. Final Tashahhud and Salawat Ibrahimiyyah','In the last rakah, recite the Tashahhud, then:'+Z('اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ','Allahumma salli ala Muhammad... innaka Hamidun Majid')+'Then make a personal dua if you wish.')}
${H('11. Taslim (ending)','Turn the face to the right, then the left, saying each time:'+Z('السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ','Assalamu alaykum wa rahmatullah'))}
${H('Rakahs of the daily prayers (Fard)','Fajr 2, Dhuhr 4, Asr 4, Maghrib 3, Isha 4.')}
${H('Sunnah and voluntary prayers','Commonly taught regular Sunnah prayers: 2 before Fajr, 4 before and 2 after Dhuhr, 2 after Maghrib, 2 after Isha. Witr is an odd number of rakahs after Isha (its ruling and form differ between schools). Other voluntary prayers can be added.')}`)},
tajweed(){const L=x=>`<span class="ar" style="font-size:1.6rem;color:var(--gold)">${x}</span>`,C=(t,b)=>`<div class="card"><b>${t}</b><div class="tr">${b}</div></div>`;
page('Tajweed',`<div style="max-width:900px;margin:auto"><div class="card mut">Tajweed means reciting each letter correctly and giving it its due. This is a beginner summary of widely taught rules. Counts and some details vary between recitation traditions, so learn the finer points from a qualified teacher.</div>
${C('1. Noon Sakinah and Tanween','When a noon with sukoon (نْ) or tanween (ـً ـٍ ـٌ) is followed by a letter, one of four rules applies:<br><br><b>Izhar (clear):</b> before the throat letters '+L('ء هـ ع ح غ خ')+' pronounce the noon clearly.<br><b>Idgham (merging):</b> before '+L('ي ر م ل و ن')+' the noon merges into the next letter. With '+L('ي ن م و')+' the merge carries ghunnah (nasal sound); with '+L('ل ر')+' it merges without ghunnah.<br><b>Iqlab (changing):</b> before '+L('ب')+' the noon sound changes to a hidden meem with ghunnah.<br><b>Ikhfa (hiding):</b> before the remaining 15 letters '+L('ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك')+' the noon is hidden with ghunnah.')}
${C('2. Meem Sakinah','When a meem with sukoon (مْ) is followed by:<br><b>Ikhfa Shafawi:</b> '+L('ب')+' — the meem is hidden with ghunnah at the lips.<br><b>Idgham Shafawi:</b> another '+L('م')+' — merged with ghunnah.<br><b>Izhar Shafawi:</b> any other letter — pronounced clearly.')}
${C('3. Ghunnah','A nasal sound held for about two counts on a noon or meem with shaddah (نّ مّ).')}
${C('4. Madd (lengthening)','<b>Natural (asli):</b> a vowel is lengthened for two counts (a fathah before alif, kasrah before ya, dammah before waw).<br><b>Connected (muttasil):</b> a hamzah follows the madd letter in the same word; usually lengthened 4 to 5 counts.<br><b>Separated (munfasil):</b> the madd letter ends a word and a hamzah begins the next; usually 4 to 5 counts.<br><b>Necessary (lazim):</b> a madd letter followed by a letter with sukoon or shaddah in the same word; lengthened 6 counts.')}
${C('5. Qalqalah (echo)','A light bounce on a letter with sukoon from '+L('ق ط ب ج د')+'. It is strongest when stopping on the letter.')}
${C('6. Heavy and light letters','The letters '+L('خ ص ض غ ط ق ظ')+' are pronounced with a full, heavy mouth. Other letters are light, with some special cases such as the letter ر (ra) and the name of Allah.')}
${C('7. Stopping (Waqf)','When you stop at the end of a word, the last letter is pronounced with sukoon. Tanween fathah is usually read as a long “a”, and the round ة (ta marbutah) is read as ه. Stop at natural pauses in the meaning, and watch the pause marks written in the Mushaf.')}
${C('8. Starting (Ibtida)','Begin from a place where the meaning is complete and does not change what the verse says. If you stopped in the middle of a connected phrase, you may go back a few words and start again.')}
<a class="btn" href="#/learn">Learn the Arabic letters</a></div>`)},
nf(m){page('404',`<div class="card err"><h2>Page not found</h2><p>${esc(m||'This page does not exist.')}</p><a class="btn" href="#/">Go home</a></div>`)}};
const nm=x=>((x%360)+360)%360,bear=(la,lo)=>{const r=Math.PI/180,k=21.4225*r,p=la*r,d=39.8262*r-lo*r;return nm(Math.atan2(Math.sin(d),Math.cos(p)*Math.tan(k)-Math.sin(p)*Math.cos(d))/r)};
/* prayer */
let PT=null,tk;const dstr=()=>{const d=new Date();return`${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}`};
async function pFetch(){const ds=dstr(),u=S.geo?`https://api.aladhan.com/v1/timings/${ds}?latitude=${S.geo.lat}&longitude=${S.geo.lng}&method=${S.pm}&school=${S.sc}`:S.city?.city?`https://api.aladhan.com/v1/timingsByCity/${ds}?city=${encodeURIComponent(S.city.city)}&country=${encodeURIComponent(S.city.country||'')}&method=${S.pm}&school=${S.sc}`:null;if(!u)throw 0;const j=await(await fetch(u)).json();if(j.code!==200)throw 0;PT=j.data.timings;PT._d=ds}
async function pDraw(){const e=$('#pt');try{await pFetch();e.innerHTML=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map(k=>`<div style="display:flex;justify-content:space-between;padding:9px 0"><b>${k}</b><span>${PT[k]}</span></div>`).join('')}catch{e.textContent='Choose a location to see prayer times.'}}
async function prayerNext(){clearInterval(tk);try{if(!PT||PT._d!==dstr())await pFetch()}catch{$('#np').textContent='Set location';$('#nc').innerHTML='<a href="#/prayer" style="color:var(--gold)">Open Prayer Times</a>';return}
const go=()=>{if(!$('#np'))return clearInterval(tk);const n=new Date();let b=null;for(const k of['Fajr','Dhuhr','Asr','Maghrib','Isha']){const[h,m]=PT[k].split(' ')[0].split(':'),t=new Date(n);t.setHours(+h,+m,0,0);if(t>n){b=[k,t];break}}
if(!b){const[h,m]=PT.Fajr.split(' ')[0].split(':'),t=new Date(n);t.setDate(t.getDate()+1);t.setHours(+h,+m,0,0);b=['Fajr',t]}
const s=Math.floor((b[1]-n)/1e3),p=x=>String(x).padStart(2,'0');$('#np').textContent=b[0];$('#nc').textContent=`in ${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`};go();tk=setInterval(go,1000)}
/* router */
function route(){menu(false);const[p,qs]=(location.hash.slice(1)||'/').split('?'),s=p.split('/').filter(Boolean),k=s[0]||'home';
document.querySelectorAll('#nav a,#bt a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+p||(s[0]&&a.getAttribute('href')==='#/'+s[0])));
if(!(k==='quran'&&s[1]==='surah')){stopA();V.onclick=null;V.oninput=null}scrollTo(0,0);
if(k==='quran'&&s[1]==='surah')return R.surah(s[2],qs);
if(k==='prayer'&&s[1]==='times')return R.prayer();
if(s.length<2&&R[k]&&k!=='nf'&&k!=='surah')return R[k]();R.nf()}
addEventListener('hashchange',route);route();
</script>
